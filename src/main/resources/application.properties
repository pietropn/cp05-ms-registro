# ===============================================
# Configurações gerais da aplicação
# ===============================================
spring.application.name=api-registro-pietro-557000-m1
server.port=8080

# Profile ativo (padrão: test). Pode ser sobrescrito pela variável SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

# JPA - o schema é gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Respostas de erro
server.error.include-message=always
server.error.include-stacktrace=never
