# ===============================================
# Profile DEV - Banco MySQL
# Valores podem ser sobrescritos por variáveis de ambiente (ex.: no Docker)
# ===============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:registrodb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.h2.console.enabled=false
spring.jpa.show-sql=true
